<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antica Cafe Inventory</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header>
    <h1>☕ Antica Cafe Inventory</h1>
    <p>Inventory Management Dashboard</p>
</header>

<div class="dashboard">

    <div class="card">
        <h3>Total Products</h3>
        <p id="totalProducts">0</p>
    </div>

    <div class="card">
        <h3>Low Stock</h3>
        <p id="lowStock">0</p>
    </div>

    <div class="card">
        <h3>Out of Stock</h3>
        <p id="outStock">0</p>
    </div>

    <div class="card">
        <h3>Inventory Value</h3>
        <p id="inventoryValue">OMR 0</p>
    </div>

</div>

<div class="inventory-box">

    <div class="controls">

        <input
        type="text"
        id="name"
        placeholder="Product Name">

        <input
        type="number"
        id="qty"
        placeholder="Quantity">

        <input
        type="number"
        id="price"
        placeholder="Unit Price">

        <button onclick="addItem()">
            Add Product
        </button>

    </div>

    <input
    type="text"
    id="search"
    class="search"
    placeholder="🔍 Search inventory..."
    onkeyup="renderTable()">

    <table>

        <thead>
            <tr>
                <th>Product</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="inventoryTable"></tbody>

    </table>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
