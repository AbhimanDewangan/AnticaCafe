<body>

<div class="container">

    <header>
        <h1>☕ Antica Inventory Dashboard</h1>
        <p>Manage cafe stock efficiently</p>
    </header>

    <section class="dashboard">

        <div class="card">
            <h3>Total Products</h3>
            <p id="totalProducts">0</p>
        </div>

        <div class="card">
            <h3>Low Stock</h3>
            <p id="lowStock">0</p>
        </div>

        <div class="card">
            <h3>Out of Stock</h3>
            <p id="outStock">0</p>
        </div>

        <div class="card">
            <h3>Inventory Value</h3>
            <p id="inventoryValue">OMR 0</p>
        </div>

    </section>

    <div class="inventory-panel">

        <div class="controls">

            <input id="name" placeholder="Product Name">

            <input id="qty" type="number" placeholder="Quantity">

            <input id="price" type="number" placeholder="Unit Price">

            <button onclick="addItem()">
                Add Product
            </button>

        </div>

        <input
            id="search"
            class="search"
            placeholder="🔍 Search products..."
            onkeyup="renderTable()">

        <table>

            <thead>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="inventoryTable"></tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
